version: "3.3"

services:
  app:
    container_name: btmx-azml-app
    image: btmx-azml:local
    build:
      context: .
      dockerfile: Dockerfile
    command: bash start.sh
    restart: unless-stopped
    stop_grace_period: 30s

    # The bot's internal Cloudflare Quick Tunnel uses port 85 in-container.
    # Keep the optional local web endpoint private and avoid common host ports.
    ports:
      - "127.0.0.1:11688:85"

    environment:
      DOWNLOAD_DIR: /usr/src/app/downloads/
      PORT: "85"
      TZ: Asia/Kolkata

    env_file:
      - .env

    volumes:
      - btmx_azml_downloads:/usr/src/app/downloads
      - btmx_azml_accounts:/usr/src/app/accounts
      - btmx_azml_qbittorrent:/usr/src/app/qBittorrent

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  btmx_azml_downloads:
  btmx_azml_accounts:
  btmx_azml_qbittorrent:
